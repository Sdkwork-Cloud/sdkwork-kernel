[workspace]
resolver = "2"
members = [
    "sdkwork-agent-kernel",
    "sdkwork-code-kernel",
    "sdkwork-agent-business",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-core",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-rig",
    "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-drive",
    "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-knowledgebase",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-core",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-hermes",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-openclaw",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-codex",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-claude-code",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-opencode",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-gemini-cli",
    "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-mimo-code",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# SDKWork workspace members - declared once at workspace root
sdkwork-agent-kernel = { path = "sdkwork-agent-kernel" }
sdkwork-code-kernel = { path = "sdkwork-code-kernel" }
sdkwork-agent-business = { path = "sdkwork-agent-business" }
sdkwork-agent-plugin-core = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-core" }
sdkwork-agent-plugin-rig = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-rig" }
sdkwork-kernel-plugin-drive = { path = "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-drive" }
sdkwork-kernel-plugin-knowledgebase = { path = "sdkwork-kernel-plugins/crates/sdkwork-kernel-plugin-knowledgebase" }
sdkwork-agent-adapter-core = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-core" }
sdkwork-agent-adapter-hermes = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-hermes" }
sdkwork-agent-adapter-openclaw = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-openclaw" }
sdkwork-agent-adapter-codex = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-codex" }
sdkwork-agent-adapter-claude-code = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-claude-code" }
sdkwork-agent-adapter-opencode = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-opencode" }
sdkwork-agent-adapter-gemini-cli = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-gemini-cli" }
sdkwork-agent-adapter-mimo-code = { path = "sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-mimo-code" }
sdkwork-drive-storage-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-storage-contract" }
sdkwork-knowledgebase-contract = { path = "../sdkwork-knowledgebase/crates/sdkwork-knowledgebase-contract" }
sdkwork_platform_id_service = { package = "sdkwork-platform-id-service", path = "../sdkwork-appbase/crates/sdkwork-platform-id-service" }
