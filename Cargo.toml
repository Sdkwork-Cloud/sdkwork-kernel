[workspace]
resolver = "2"
members = [
    "sdkwork-agent-kernel",
    "sdkwork-code-kernel",
    "sdkwork-agent-business",
    "sdkwork-agent-integrations/crates/sdkwork-agent-integration-core",
    "sdkwork-agent-integrations/crates/sdkwork-agent-integration-rig",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# SDKWork workspace members - declared once at workspace root
sdkwork-agent-kernel = { path = "sdkwork-agent-kernel" }
sdkwork-code-kernel = { path = "sdkwork-code-kernel" }
sdkwork-agent-business = { path = "sdkwork-agent-business" }
sdkwork-agent-integration-core = { path = "sdkwork-agent-integrations/crates/sdkwork-agent-integration-core" }
sdkwork-agent-integration-rig = { path = "sdkwork-agent-integrations/crates/sdkwork-agent-integration-rig" }
sdkwork_id = { path = "../sdkwork-appbase/packages/native-rust/foundation/sdkwork-id-rust" }
