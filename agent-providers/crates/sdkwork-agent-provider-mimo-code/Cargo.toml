[package]
name = "sdkwork-agent-provider-mimo-code"
version = "0.2.0"
edition = "2021"
description = "MiMo Code agent provider integration for SDKWork Agent Kernel"

[lib]
name = "sdkwork_agent_provider_mimo_code"
path = "src/lib.rs"

[dependencies]
sdkwork-agent-kernel = { path = "../../../sdkwork-agent-kernel" }
sdkwork-agent-provider-core = { path = "../../../sdkwork-kernel-plugins/crates/sdkwork-agent-provider-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
