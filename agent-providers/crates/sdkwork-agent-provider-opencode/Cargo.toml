[package]
name = "sdkwork-agent-provider-opencode"
version = "0.2.0"
edition = "2021"
description = "OpenCode agent provider integration for SDKWork Agent Kernel"

[lib]
name = "sdkwork_agent_provider_opencode"
path = "src/lib.rs"

[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-agent-plugin-core.workspace = true
sdkwork-agent-provider-core.workspace = true
sdkwork-agent-provider-spi.workspace = true
sdkwork-agent-provider-transport-core.workspace = true
sdkwork-agent-provider-transport-node.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite.workspace = true
