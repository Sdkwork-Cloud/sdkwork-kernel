openapi: 3.1.2
info:
  title: SDKWork Agent Internal API
  version: 0.1.0
  description: Application-ingress internal runtime API for SDKWork agent runtime hosts and trusted in-app automation.
servers:
  - url: '{applicationPublicIngressOrigin}'
    description: Runtime origin from topology env `SDKWORK_KERNEL_APPLICATION_PUBLIC_HTTP_URL`.
    variables:
      applicationPublicIngressOrigin:
        default: http://127.0.0.1:18280
        description: Local default from `standalone.split-services.development`; production profiles override via topology env files.
tags:
  - name: intelligence
    description: Agent intelligence runtime operations on application ingress.
paths:
  /internal/v3/api/intelligence/runtime/manifest:
    get:
      tags: [intelligence]
      summary: Load runtime capability manifest
      description: Returns the runtime capability manifest (runtime id, agent id, kernel version, capabilities, providers) without persistence-derived state. Suitable for UI clients, CI gates, and conformance runners. Aligns with AGENT_RUNTIME_SPEC §4 get_runtime_manifest and get_capability_manifest.
      operationId: runtime.manifest.get
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Runtime capability manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeManifestResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/health:
    get:
      tags: [intelligence]
      summary: Runtime liveness and readiness probe
      description: Lightweight liveness/readiness surface combining runtime state and persistence health. Side-effect-free; safe for load-balancer polls. Aligns with AGENT_RUNTIME_SPEC §4 get_health.
      operationId: runtime.health.get
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Runtime health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeHealthResponse'
        '503':
          description: Runtime degraded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/diagnostics:
    get:
      tags: [intelligence]
      summary: Load runtime diagnostics report
      description: Machine-readable runtime diagnostic report validating against schemas/agent-runtime-diagnostics.schema.json. Suitable for support bundles, registry validation, and conformance runners. Aligns with AGENT_RUNTIME_SPEC §4.1 get_diagnostics.
      operationId: runtime.diagnostics.get
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Runtime diagnostics report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeDiagnosticsResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/snapshot:
    get:
      tags: [intelligence]
      summary: Load runtime aggregate snapshot
      operationId: runtime.snapshot.load
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Runtime aggregate snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSnapshotResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/permissions/{permissionRequestId}:
    post:
      tags: [intelligence]
      summary: Decide a permission request
      operationId: runtime.permissions.decide
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/PermissionRequestIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionDecisionRequest'
      responses:
        '200':
          description: Updated permission request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionRequestResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions:
    get:
      tags: [intelligence]
      summary: List runtime sessions
      operationId: runtime.sessions.list
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [intelligence]
      summary: Create a runtime session
      operationId: runtime.sessions.create
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}:
    get:
      tags: [intelligence]
      summary: Retrieve a runtime session
      operationId: runtime.sessions.retrieve
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionItemResponse'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [intelligence]
      summary: Delete a runtime session
      operationId: runtime.sessions.delete
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '204':
          description: Session deleted
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/close:
    post:
      tags: [intelligence]
      summary: Close a runtime session
      operationId: runtime.sessions.close
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Closed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/messages:
    get:
      tags: [intelligence]
      summary: List session messages
      operationId: runtime.sessions.messages.list
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [intelligence]
      summary: Send a session message
      operationId: runtime.sessions.messages.send
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/tasks:
    get:
      tags: [intelligence]
      summary: List session tasks
      operationId: runtime.sessions.tasks.list
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [intelligence]
      summary: Submit a session task
      operationId: runtime.sessions.tasks.submit
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/tasks/{taskId}:
    get:
      tags: [intelligence]
      summary: Retrieve a task
      operationId: runtime.tasks.retrieve
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/tasks/{taskId}/cancel:
    post:
      tags: [intelligence]
      summary: Cancel a task
      operationId: runtime.tasks.cancel
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Cancelled task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/models:
    get:
      tags: [intelligence]
      summary: List available models
      operationId: runtime.models.list
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Model catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/model/invoke:
    post:
      tags: [intelligence]
      summary: Invoke a model for a session
      operationId: runtime.sessions.model.invoke
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeModelRequest'
      responses:
        '200':
          description: Model invocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeModelItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/model/stream:
    post:
      tags: [intelligence]
      summary: Stream a model response via SSE
      description: |
        Returns a Server-Sent Events stream of model output chunks for
        real-time token-by-token display in chat UIs. Each SSE event has
        type `model.chunk` with a JSON payload containing `modelRequestId`,
        `sequence`, `content`, and `finishReason`. The stream terminates
        with a `model.done` event.
      operationId: runtime.sessions.model.stream
      x-sdkwork-wire-protocol: external
      x-sdkwork-external-protocol-id: server-sent-events
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamModelRequest'
      responses:
        '200':
          description: Server-sent events stream of model output chunks
          content:
            text/event-stream:
              schema:
                type: string
        '503':
          description: Maximum concurrent SSE streams reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/model/cancel:
    post:
      tags: [intelligence]
      summary: Cancel an in-flight model invocation
      description: |
        Signals the model provider to cancel the generation identified by
        `modelRequestId`. Returns a terminal `ModelResponse` with
        `status: "cancelled"` and `finishReason: "cancelled"`.
      operationId: runtime.sessions.model.cancel
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelModelRequest'
      responses:
        '200':
          description: Model cancellation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelModelItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/tools:
    get:
      tags: [intelligence]
      summary: List session tools
      operationId: runtime.sessions.tools.list
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Tool catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCatalogListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/tools/{toolName}/execute:
    post:
      tags: [intelligence]
      summary: Execute a tool for a session
      operationId: runtime.sessions.tools.execute
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/ToolNamePath'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteToolRequest'
      responses:
        '200':
          description: Tool execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteToolItemResponse'
        default:
          $ref: '#/components/responses/Problem'
  /internal/v3/api/intelligence/runtime/sessions/{sessionId}/events/stream:
    get:
      tags: [intelligence]
      summary: Stream session events
      operationId: runtime.sessions.events.stream
      x-sdkwork-wire-protocol: external
      x-sdkwork-external-protocol-id: server-sent-events
      security:
        - ApiKey: []
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-api-surface: internal-api
      x-sdkwork-auth-mode: ingress-token
      x-sdkwork-domain: intelligence
      x-sdkwork-resource: runtime
      x-sdkwork-tenant-scope: application
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - $ref: '#/components/parameters/LastEventIdQuery'
        - $ref: '#/components/parameters/LiveQuery'
        - $ref: '#/components/parameters/SdkworkTenantIdHeader'
        - $ref: '#/components/parameters/SdkworkUserIdHeader'
        - $ref: '#/components/parameters/SdkworkIdentityMacHeader'
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Application ingress token. Runtime also accepts Authorization Bearer and x-sdkwork-access-token.
  parameters:
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
