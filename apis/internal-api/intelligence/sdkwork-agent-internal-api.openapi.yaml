      name: page
      in: query
      required: false
      description: One-based page index for offset pagination. Default 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Page size for offset pagination. Default 20, maximum 200.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
