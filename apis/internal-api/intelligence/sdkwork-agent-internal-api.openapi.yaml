    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Request endpoint occurrence in the form `{METHOD} {routeTemplate}`.
        operationId:
          type: string
        code:
          type: integer
          format: int32
          description: Numeric error result code. MUST be non-zero. See API_SPEC.md §15.3.
          minimum: 40001
          maximum: 79999
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        errorCategory:
          type: string
        retryable:
          type: boolean
    SdkWorkApiResponse:
      type: object
      additionalProperties: false
      required: [code, data, traceId]
      properties:
        code:
          type: integer
          format: int32
          description: Numeric success result code. MUST be 0 on HTTP 2xx JSON bodies.
          enum: [0]
          default: 0
          minimum: 0
          maximum: 0
        data:
          description: Operation-specific payload.
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
