        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          type: string
          pattern: '^[0-9]+$'
        totalPages:
          type: integer
          minimum: 0
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
