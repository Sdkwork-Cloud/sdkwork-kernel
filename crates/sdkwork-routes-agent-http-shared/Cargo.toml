[package]
name = "sdkwork-routes-agent-http-shared"
version.workspace = true
edition.workspace = true
description = "Shared sdkwork-web-framework route manifests and bootstrap helpers for agent HTTP surfaces."

[dependencies]
axum = "0.8"
sdkwork-agent-business = { workspace = true, features = ["http-axum"] }
sdkwork-iam-web-adapter.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-web-contract.workspace = true
sdkwork-web-core.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
