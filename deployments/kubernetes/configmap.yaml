apiVersion: v1
kind: ConfigMap
metadata:
  name: sdkwork-agent-server
  labels:
    app.kubernetes.io/name: sdkwork-agent-server
    app.kubernetes.io/part-of: sdkwork-kernel
data:
  SDKWORK_KERNEL_ENVIRONMENT: production
  SDKWORK_KERNEL_DEPLOYMENT_PROFILE: cloud
  SDKWORK_KERNEL_RUNTIME_TARGET: server
  SDKWORK_KERNEL_APPLICATION_PUBLIC_INGRESS_BIND: 0.0.0.0:18280
  SDKWORK_KERNEL_APPLICATION_PUBLIC_HTTP_URL: https://kernel.sdkwork.com
  SDKWORK_KERNEL_APPLICATION_PUBLIC_WEBSOCKET_URL: wss://kernel.sdkwork.com
  SDKWORK_AGENT_RUNTIME_DATABASE_ENGINE: postgres
  SDKWORK_KERNEL_INGRESS_AUTH_MODE: token
  SDKWORK_KERNEL_METRICS_AUTH_MODE: token
  SDKWORK_KERNEL_AGENT_PLUGIN: rig
  SDKWORK_RATE_LIMIT_RPS: "100"
  SDKWORK_RATE_LIMIT_BURST: "200"
  SDKWORK_CORS_ORIGINS: https://kernel.sdkwork.com,https://app.sdkwork.com
