apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-agent-server
  labels:
    app.kubernetes.io/name: sdkwork-agent-server
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-agent-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-agent-server
        app.kubernetes.io/part-of: sdkwork-kernel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      # Spread pods across nodes and zones for high availability.
      # Soft anti-affinity ensures best-effort spreading without blocking
      # scheduling when only one node is available (e.g., dev clusters).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sdkwork-agent-server
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sdkwork-agent-server
      containers:
        - name: agent-server
          image: sdkwork-kernel-agent-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18280
          envFrom:
            - configMapRef:
                name: sdkwork-agent-server
          env:
            - name: SDKWORK_KERNEL_INGRESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: ingress-token
            - name: SDKWORK_KERNEL_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: metrics-token
                  optional: true
            - name: SDKWORK_OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: sdkwork-agent-server-observability
                  key: otlp-endpoint
                  optional: true
          startupProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
