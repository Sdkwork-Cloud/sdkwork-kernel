apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-agent-server
  annotations:
    sdkwork.com/release-image-policy: immutable-digest-required
  labels:
    app.kubernetes.io/name: sdkwork-agent-server
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-agent-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-agent-server
        app.kubernetes.io/part-of: sdkwork-kernel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # Production requires enough nodes and zones to satisfy these hard
      # placement constraints. Use a separate staging overlay for single-node
      # clusters; do not weaken this production manifest in place.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sdkwork-agent-server
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sdkwork-agent-server
      containers:
        - name: agent-server
          # The release pipeline/operator must replace this convenience tag
          # with the verified immutable OCI digest before production apply.
          image: sdkwork-kernel-agent-server:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 18280
          envFrom:
            - configMapRef:
                name: sdkwork-agent-server
          env:
            - name: SDKWORK_KERNEL_INGRESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: ingress-token
            - name: SDKWORK_KERNEL_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: metrics-token
            - name: SDKWORK_CURSOR_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: cursor-signing-secret
            - name: SDKWORK_APPROVAL_PAYLOAD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: approval-payload-encryption-key
            - name: SDKWORK_AGENT_RUNTIME_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: runtime-database-url
            - name: SDKWORK_RATE_LIMIT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: runtime-redis-url
            - name: SDKWORK_OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: sdkwork-agent-server-observability
                  key: otlp-endpoint
                  optional: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: runtime-home
              mountPath: /var/lib/sdkwork
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-home
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
