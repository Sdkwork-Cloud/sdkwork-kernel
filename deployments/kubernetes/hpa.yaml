apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sdkwork-agent-server
  labels:
    app.kubernetes.io/name: sdkwork-agent-server
    app.kubernetes.io/part-of: sdkwork-kernel
  annotations:
    # Custom metrics are exposed via Prometheus at /metrics and consumed
    # by a prometheus-adapter or kube-metrics-adapter. The following
    # annotations document the custom metric names that can be referenced
    # in an external metrics block when the adapter is deployed.
    sdkwork.io/custom-metrics: |
      sdkwork_kernel_http_requests_total,
      sdkwork_kernel_http_request_duration_seconds,
      sdkwork_kernel_http_rate_limited_total,
      sdkwork_kernel_sse_active_connections,
      sdkwork_kernel_model_invocations_total,
      sdkwork_kernel_model_tokens_total,
      sdkwork_kernel_tenant_token_quota_rejected_total
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sdkwork-agent-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Scale based on active SSE connections only after the metrics adapter
    # mapping and a target-environment load test have been verified.
    # - type: Pods
    #   pods:
    #     metric:
    #       name: sdkwork_kernel_sse_active_connections
    #     target:
    #       type: AverageValue
    #       averageValue: "64"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min
