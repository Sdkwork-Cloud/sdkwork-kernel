apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sdkwork-agent-server
  labels:
    app.kubernetes.io/name: sdkwork-agent-server
    app.kubernetes.io/part-of: sdkwork-kernel
  annotations:
    # Custom metrics are exposed via Prometheus at /metrics and consumed
    # by a prometheus-adapter or kube-metrics-adapter. The following
    # annotations document the custom metric names that can be referenced
    # in an external metrics block when the adapter is deployed.
    sdkwork.io/custom-metrics: |
      http_requests_total, http_request_duration_seconds,
      rate_limited_total, sse_active_connections,
      model_invocation_total, model_token_usage_total,
      tenant_token_quota_rejection_total
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sdkwork-agent-server
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Scale based on active SSE connections when a metrics adapter
    # is available. Uncomment after deploying prometheus-adapter.
    # - type: Pods
    #   pods:
    #     metric:
    #       name: sse_active_connections
    #     target:
    #       type: AverageValue
    #       averageValue: "64"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
      selectPolicy: Min
