# Production base policy for sdkwork-agent-server.
#
# Before applying it, label the approved ingress and monitoring namespaces as
# documented in the production runbook. Standard Kubernetes NetworkPolicy
# cannot select an external managed service by DNS name, so production
# environments must also add a provider/CNI-specific egress policy limited to
# the exact managed PostgreSQL, Redis, and private OTLP destinations. This base
# policy intentionally fails closed for undeclared external private endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdkwork-agent-server
  labels:
    app.kubernetes.io/name: sdkwork-agent-server
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-agent-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              sdkwork.com/agent-server-ingress: "true"
      ports:
        - protocol: TCP
          port: 18280
    - from:
        - namespaceSelector:
            matchLabels:
              sdkwork.com/agent-server-monitoring: "true"
      ports:
        - protocol: TCP
          port: 18280
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Public HTTPS is required for approved provider APIs and HTTPS JWKS.
    # Private provider endpoints require an environment-specific overlay.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
    # Same-namespace operator-managed or staging data services may opt in with
    # these labels. Managed external services require the explicit overlay
    # described above and in the runbook.
    - to:
        - podSelector:
            matchLabels:
              sdkwork.com/runtime-data-service: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              sdkwork.com/runtime-data-service: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4318
