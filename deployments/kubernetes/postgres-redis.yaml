apiVersion: v1
kind: Service
metadata:
  name: sdkwork-agent-runtime-postgres
  labels:
    app.kubernetes.io/name: sdkwork-agent-runtime-postgres
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: sdkwork-agent-runtime-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-agent-runtime-postgres
  labels:
    app.kubernetes.io/name: sdkwork-agent-runtime-postgres
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-agent-runtime-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-agent-runtime-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sdkwork
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdkwork-agent-server
                  key: runtime-postgres-password
            - name: POSTGRES_DB
              value: sdkwork_agent_runtime
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sdkwork-agent-runtime-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdkwork-agent-runtime-postgres-data
  labels:
    app.kubernetes.io/name: sdkwork-agent-runtime-postgres
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sdkwork-agent-runtime-redis
  labels:
    app.kubernetes.io/name: sdkwork-agent-runtime-redis
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: sdkwork-agent-runtime-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-agent-runtime-redis
  labels:
    app.kubernetes.io/name: sdkwork-agent-runtime-redis
    app.kubernetes.io/part-of: sdkwork-kernel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-agent-runtime-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-agent-runtime-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
