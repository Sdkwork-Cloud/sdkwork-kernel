# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/kernel/webserver.pid;
error_log /var/log/sdkwork/kernel/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name kernel-dev.sdkwork.com kernel-dev.birdcoder.com kernel-dev.dtupay.com kernel-dev.sdkwork.cn kernel-dev.birdcoder.cn kernel-dev.dtupay.cn kernel-dev.skubc.com kernel-dev.skubc.cn kernel-dev.zowalk.com kernel-dev.zowalk.cn kernel-dev.offer86.com kernel-dev.offer86.cn kernel-dev.86offer.com kernel-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
