components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: true
      description: Tenant id in int64-string form.
      schema:
        $ref: '#/components/schemas/Int64String'
    OrganizationId:
      name: organization_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Int64String'
    OwnerUserId:
      name: owner_user_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Int64String'
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ExpectedVersion:
      name: expected_version
      in: query
      required: false
      description: Optimistic concurrency version in int64-string form.
      schema:
        $ref: '#/components/schemas/Int64String'
    RequestedAt:
      name: requested_at
      in: query
      required: true
      description: RFC3339 mutation timestamp.
      schema:
        type: string
        format: date-time
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    BindingIdPath:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    KnowledgeBaseIdPath:
      name: knowledgeBaseId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^knowledge\.base\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    KnowledgeSourceIdPath:
      name: knowledgeSourceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^knowledge\.source\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    KnowledgeDocumentIdPath:
      name: knowledgeDocumentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^knowledge\.document\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    KnowledgeChunkIdPath:
      name: knowledgeChunkId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^knowledge\.chunk\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    KnowledgeIndexIdPath:
      name: knowledgeIndexId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^knowledge\.index\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    KnowledgeBindingIdPath:
      name: knowledgeBindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^knowledge\.binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    KnowledgeSyncJobIdPath:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^knowledge\.sync\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    MemoryStoreIdPath:
      name: memoryStoreId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^memory\.store\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    MemoryProfileIdPath:
      name: memoryProfileId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^memory\.profile\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    MemoryBindingIdPath:
      name: memoryBindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^memory\.binding\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    MemoryNamespaceIdPath:
      name: memoryNamespaceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^memory\.namespace\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
    MemoryIdPath:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^memory\.record\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
  responses:
    Problem:
      description: RFC 9457 problem detail response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            ValidationError:
              summary: Validation failure
              value:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: requestedAt must be RFC3339 date-time
                code: validation_error
                errorCategory: validation
                retryable: false
            VersionConflict:
              summary: Optimistic concurrency conflict
              value:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
            PermissionRequired:
              summary: Permission denied
              value:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
            NotFound:
              summary: Resource not found
              value:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
  schemas:
    Int64String:
      type: string
      pattern: '^[0-9]+$'
    AgentStatus:
      type: string
      enum: [draft, active, disabled, archived, deleted]
    AgentVisibility:
      type: string
      enum: [private, organization, tenant, public]
    AgentImplementationKind:
      type: string
      enum: [manifest-only, typed-local-provider, process-adapter, protocol-adapter]
    DeploymentStatus:
      type: string
      enum: [created, active, failed, archived]
    KnowledgeBaseKind:
      type: string
      enum: [wiki, document-repository, database, api-reference, graph, hybrid, external-provider, file-store]
    KnowledgeIndexKind:
      type: string
      description: Retrieval index mode. RAG is not vector-only; exact, keyword, full_text, structured, graph, wiki, rule, hybrid, llm_rerank, and external indexes are first-class modes.
      enum: [exact, keyword, full_text, structured, graph, wiki, rule, vector, hybrid, llm_rerank, external]
    KnowledgeSourceKind:
      type: string
      enum: [upload, wiki, web, database, api, filesystem, manual, external-provider]
    KnowledgeDocumentKind:
      type: string
      enum: [wiki-page, wiki-section, article, faq, api-reference, spec, runbook, policy, external-reference, other]
    KnowledgeBindingScopeKind:
      type: string
      enum: [agent, deployment, user, session, organization, tenant]
    KnowledgeSyncJobKind:
      type: string
      enum: [import, refresh, reindex, delete]
    KnowledgeSyncJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    MemoryStoreKind:
      type: string
      enum: [local-postgres, external-provider, vector-store, graph-store, hybrid-store, file-store]
    MemoryIndexKind:
      type: string
      description: Agent memory retrieval index mode; memory retrieval is provider-neutral and is not vector-only.
      enum: [keyword, sparse, vector, graph, wiki, rule, hybrid]
    MemoryBindingScopeKind:
      type: string
      enum: [agent, deployment, user, session, organization, tenant]
    MemoryNamespaceKind:
      type: string
      enum: [tenant, organization, agent, user, session, thread, task]
    MemoryRecordKind:
      type: string
      enum: [working, episodic, semantic, procedural, preference, summary, task, correction, system]
    MemorySourceKind:
      type: string
      enum: [conversation-message, tool-result, document, knowledge-ref, human-feedback, system-rule, business-event]
    MemoryRelationKind:
      type: string
      enum: [supports, contradicts, supersedes, duplicates, depends-on, part-of, about-entity]
    PageInfo:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          $ref: '#/components/schemas/Int64String'
        totalPages:
          type: integer
          minimum: 0
    AgentRecord:
      type: object
      additionalProperties: false
      required: [id, agentId, tenantId, organizationId, ownerUserId, code, displayName, manifest, status, visibility, tags, version, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Int64String'
        agentId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^agent\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        tenantId:
          $ref: '#/components/schemas/Int64String'
        organizationId:
          $ref: '#/components/schemas/Int64String'
        ownerUserId:
          $ref: '#/components/schemas/Int64String'
        code:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 4096
        manifest:
          type: object
          additionalProperties: true
        defaultCodeTaskIntent:
          type: [object, 'null']
          additionalProperties: true
        implementationProviderId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '^provider\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        implementationKind:
          oneOf:
            - $ref: '#/components/schemas/AgentImplementationKind'
            - type: 'null'
        status:
          $ref: '#/components/schemas/AgentStatus'
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 64
        version:
          $ref: '#/components/schemas/Int64String'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
    AgentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentRecord'
        requestId:
          type: string
    AgentListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, pageInfo]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AgentRecord'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
