openapi: 3.1.2
info:
  title: SDKWork Agent Open API
  version: 0.1.0
  description: Developer-facing agent Open API for SDKWork agent integrations.
x-sdkwork-owner: sdkwork-kernel
x-sdkwork-api-authority: sdkwork-agent-open-api
x-sdkwork-sdk-family: sdkwork-agent-sdk
x-sdkwork-owner-only-input: true
x-sdkwork-standard-version: '2026-06-06'
servers:
  - url: http://localhost:8080
tags:
  - name: ai
    description: Managed AI agent operations for app clients.
paths:
  /agent/v3/api/ai/agents:
    get:
      x-sdkwork-owner: sdkwork-kernel
      x-sdkwork-api-authority: sdkwork-agent-open-api
      tags: [ai]
      summary: List managed agents
      operationId: agents.list
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.list
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.listed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OwnerUserId'
        - $ref: '#/components/parameters/IncludeDeleted'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Managed agent list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      x-sdkwork-owner: sdkwork-kernel
      x-sdkwork-api-authority: sdkwork-agent-open-api
      tags: [ai]
      summary: Create a managed agent
      operationId: agents.create
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.create
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.created
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Created managed agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '409':
          description: Resource conflict (duplicate agent_id or code within tenant scope)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/conflict
                title: conflict
                status: 409
                detail: agent already exists
                code: conflict
                errorCategory: business
                retryable: false
        default:
          $ref: '#/components/responses/Problem'
  /agent/v3/api/ai/agents/{agentId}:
    get:
      x-sdkwork-owner: sdkwork-kernel
      x-sdkwork-api-authority: sdkwork-agent-open-api
      tags: [ai]
      summary: Retrieve one managed agent
      operationId: agents.retrieve
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.retrieve
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.retrieved
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        default:
          $ref: '#/components/responses/Problem'
    patch:
      x-sdkwork-owner: sdkwork-kernel
      x-sdkwork-api-authority: sdkwork-agent-open-api
      tags: [ai]
      summary: Update one managed agent
      operationId: agents.update
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.update
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.updated
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
        default:
          $ref: '#/components/responses/Problem'
    delete:
      x-sdkwork-owner: sdkwork-kernel
      x-sdkwork-api-authority: sdkwork-agent-open-api
      tags: [ai]
      summary: Soft-delete one managed agent
      operationId: agents.delete
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.delete
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.deleted
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentRequest'
      responses:
        '200':
          description: Soft-deleted managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
        default:
          $ref: '#/components/responses/Problem'
