[package]
name = "sdkwork-agent-business"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres-sync = ["dep:sdkwork-database-config", "dep:sdkwork-database-sqlx", "dep:sqlx", "dep:tokio"]
http-axum = ["dep:axum", "dep:tokio", "dep:tower"]

[lib]
name = "sdkwork_agent_business"
path = "src/lib.rs"

[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-code-kernel.workspace = true
sdkwork-utils-rust.workspace = true
sdkwork-id-core = { path = "../../sdkwork-id/crates/sdkwork-id-core" }
sdkwork-intelligence-prompts-ai-contract = { path = "../../sdkwork-prompts/crates/sdkwork-intelligence-prompts-ai-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sdkwork-database-config = { workspace = true, optional = true }
sdkwork-database-sqlx = { workspace = true, optional = true }
sqlx = { version = "0.8", default-features = false, optional = true, features = ["runtime-tokio", "postgres", "time"] }
axum = { version = "0.8", optional = true, features = ["json"] }
tokio = { version = "1.0", optional = true, features = ["rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5", optional = true, features = ["util"] }
time = { version = "0.3", features = ["parsing"] }

[[test]]
name = "agent_postgres_sync_contracts"
path = "tests/agent_postgres_sync_contracts.rs"
required-features = ["postgres-sync"]
