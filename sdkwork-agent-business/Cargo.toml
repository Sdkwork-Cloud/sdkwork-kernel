[package]
name = "sdkwork-agent-business"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres-sync = ["dep:postgres"]
http-axum = ["dep:axum", "dep:tokio", "dep:tower"]

[lib]
name = "sdkwork_agent_business"
path = "src/lib.rs"

[dependencies]
sdkwork-agent-kernel = { path = "../sdkwork-agent-kernel" }
sdkwork-code-kernel = { path = "../sdkwork-code-kernel" }
sdkwork_id = { path = "D:/javasource/spring-ai-plus/spring-ai-plus-business/apps/sdkwork-appbase/packages/native-rust/foundation/sdkwork-id-rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postgres = { version = "0.19", optional = true }
axum = { version = "0.8", optional = true, features = ["json"] }
tokio = { version = "1.0", optional = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", optional = true, features = ["util"] }
time = { version = "0.3", features = ["parsing"] }
