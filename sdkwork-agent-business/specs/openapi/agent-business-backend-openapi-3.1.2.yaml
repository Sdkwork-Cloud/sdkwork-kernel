openapi: 3.1.2
info:
  title: SDKWork Agent Business Backend API
  version: 0.1.0
  description: Backend-facing managed agent APIs for sdkwork-agent-business.
servers:
  - url: http://localhost:8080
tags:
  - name: ai
    description: Managed AI agent operations for backend/admin surfaces.
paths:
  /backend/v3/api/ai/agents:
    get:
      tags: [ai]
      summary: List managed agents for backend administration
      operationId: agents.list
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.list
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.listed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/OwnerUserId'
        - $ref: '#/components/parameters/IncludeDeleted'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Managed agent list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [ai]
      summary: Create a managed agent
      operationId: agents.create
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.create
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.created
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Created managed agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '409':
          description: Resource conflict (duplicate agent_id or code within tenant scope)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/conflict
                title: conflict
                status: 409
                detail: agent already exists
                code: conflict
                errorCategory: business
                retryable: false
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}:
    get:
      tags: [ai]
      summary: Retrieve one managed agent
      operationId: agents.retrieve
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.retrieve
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.retrieved
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [ai]
      summary: Update one managed agent
      operationId: agents.update
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.update
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.updated
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Updated managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/status:
    post:
      tags: [ai]
      summary: Update managed agent status
      operationId: agents.status.update
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.status
      x-sdkwork-permission: agent.business.status.update
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.status_changed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentStatusRequest'
      responses:
        '200':
          description: Updated managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/restore:
    post:
      tags: [ai]
      summary: Restore one soft-deleted managed agent
      operationId: agents.restore
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents
      x-sdkwork-permission: agent.business.restore
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.restored
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreAgentRequest'
      responses:
        '200':
          description: Restored managed agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
        '409':
          description: Optimistic concurrency conflict (stale expectedVersion)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/audit_events:
    get:
      tags: [ai]
      summary: List managed agent audit events
      operationId: agents.auditEvents.list
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.auditEvents
      x-sdkwork-permission: agent.business.audit.read
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.audit_events.listed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: Managed agent audit events response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAuditEventListResponse'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
        '400':
          description: Invalid audit query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: page_size must be less than or equal to 200
                code: validation_error
                errorCategory: validation
                retryable: false
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/provider_bindings:
    get:
      tags: [ai]
      summary: List provider bindings for one managed agent
      operationId: agents.providerBindings.list
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.providerBindings
      x-sdkwork-permission: agent.business.provider_binding.list
      x-sdkwork-tenant-scope: tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Managed agent provider binding list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderBindingListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [ai]
      summary: Create a provider binding for one managed agent
      operationId: agents.providerBindings.create
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.providerBindings
      x-sdkwork-permission: agent.business.provider_binding.add
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.provider_binding_changed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentProviderBindingRequest'
      responses:
        '201':
          description: Created managed agent provider binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderBindingResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/provider_bindings/{bindingId}/activate:
    post:
      tags: [ai]
      summary: Activate one managed agent provider binding
      operationId: agents.providerBindings.activate
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.providerBindings
      x-sdkwork-permission: agent.business.provider_binding.activate
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.provider_binding_changed
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/BindingIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAgentProviderBindingRequest'
      responses:
        '200':
          description: Activated managed agent provider binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderBindingResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /backend/v3/api/ai/agents/{agentId}/deployments:
    get:
      tags: [ai]
      summary: List deployments for one managed agent
      operationId: agents.deployments.list
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.deployments
      x-sdkwork-permission: agent.business.deployment.list
      x-sdkwork-tenant-scope: tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Managed agent deployment list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [ai]
      summary: Create a deployment snapshot for one managed agent provider binding
      operationId: agents.deployments.create
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-domain: ai
      x-sdkwork-resource: agents.deployments
      x-sdkwork-permission: agent.business.deployment.create
      x-sdkwork-tenant-scope: tenant
      x-sdkwork-audit-event: agent.business.deployment_created
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentDeploymentRequest'
      responses:
        '201':
          description: Created managed agent deployment snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: true
      description: Tenant id in int64-string form.
      schema:
        $ref: '#/components/schemas/Int64String'
    OrganizationId:
      name: organization_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Int64String'
    OwnerUserId:
      name: owner_user_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Int64String'
    IncludeDeleted:
      name: include_deleted
      in: query
      required: false
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SearchQ:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentIdPath:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BindingIdPath:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AuditAction:
      name: action
      in: query
      required: false
      description: Filter by audit action.
      schema:
        $ref: '#/components/schemas/AuditAction'
    AuditFrom:
      name: from
      in: query
      required: false
      description: RFC3339 lower-bound timestamp (inclusive).
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: RFC3339 upper-bound timestamp (inclusive), must be >= from.
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: RFC 9457 problem detail response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            ValidationError:
              summary: Validation failure
              value:
                type: https://sdkwork.dev/problems/validation_error
                title: validation_error
                status: 400
                detail: requestedAt must be RFC3339 date-time
                code: validation_error
                errorCategory: validation
                retryable: false
            VersionConflict:
              summary: Optimistic concurrency conflict
              value:
                type: https://sdkwork.dev/problems/version_conflict
                title: version_conflict
                status: 409
                detail: "agent version mismatch: expected=2, actual=3"
                code: version_conflict
                errorCategory: concurrency
                retryable: true
            PermissionRequired:
              summary: Permission denied
              value:
                type: https://sdkwork.dev/problems/permission_required
                title: permission_required
                status: 403
                detail: agent management denied
                code: permission_required
                errorCategory: permission
                retryable: false
            NotFound:
              summary: Resource not found
              value:
                type: https://sdkwork.dev/problems/not_found
                title: not_found
                status: 404
                detail: agent not found
                code: not_found
                errorCategory: resource
                retryable: false
  schemas:
    Int64String:
      type: string
      pattern: '^[0-9]+$'
    AgentStatus:
      type: string
      enum: [draft, active, disabled, archived, deleted]
    AgentVisibility:
      type: string
      enum: [private, organization, tenant, public]
    AuditAction:
      type: string
      enum: [created, updated, deleted, restored, status_changed, provider_binding_changed, deployment_created]
    AgentImplementationKind:
      type: string
      enum: [manifest-only, typed-local-provider, process-adapter, protocol-adapter]
    DeploymentStatus:
      type: string
      enum: [created, active, failed, archived]
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        totalItems:
          $ref: '#/components/schemas/Int64String'
        totalPages:
          type: integer
          minimum: 0
    AgentRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - agentId
        - tenantId
        - organizationId
        - ownerUserId
        - code
        - displayName
        - manifest
        - status
        - visibility
        - tags
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Int64String'
        agentId:
          type: string
        tenantId:
          $ref: '#/components/schemas/Int64String'
        organizationId:
          $ref: '#/components/schemas/Int64String'
        ownerUserId:
          $ref: '#/components/schemas/Int64String'
        code:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, 'null']
          maxLength: 4096
        manifest:
          type: object
          additionalProperties: true
        defaultCodeTaskIntent:
          type: [object, 'null']
          additionalProperties: true
        implementationProviderId:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '^provider\.[a-z0-9_-]+(\.[a-z0-9_-]+)*$'
        implementationKind:
          oneOf:
            - $ref: '#/components/schemas/AgentImplementationKind'
            - type: 'null'
        status:
          $ref: '#/components/schemas/AgentStatus'
        visibility:
          $ref: '#/components/schemas/AgentVisibility'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 64
        version:
          $ref: '#/components/schemas/Int64String'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: [string, 'null']
          format: date-time
    AgentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AgentRecord'
        requestId:
          type: string
    AgentListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items, pageInfo]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AgentRecord'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
        requestId:
          type: string
    AgentProviderBindingRecord:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - agentId
        - bindingId
        - providerId
        - implementationKind
