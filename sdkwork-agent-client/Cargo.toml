[package]
name = "sdkwork-agent-client"
version = "0.1.0"
edition = "2021"
description = "Client SDK for SDKWork agent chat with SSE and WebSocket support"

[features]
default = ["http"]
http = ["dep:reqwest"]
websocket = ["dep:tokio-tungstenite"]

[dependencies]
sdkwork-agent-kernel = { path = "../sdkwork-agent-kernel" }
sdkwork-agent-adapter-codex = { path = "../sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-codex" }
sdkwork-agent-adapter-openclaw = { path = "../sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-openclaw" }
sdkwork-agent-adapter-hermes = { path = "../sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-hermes" }
sdkwork-agent-sdk-spi = { path = "../sdkwork-agent-sdk-spi" }
sdkwork-agent-database = { path = "../sdkwork-agent-database", features = ["sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"

# HTTP/SSE
reqwest = { version = "0.12", features = ["stream", "json"], optional = true }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
