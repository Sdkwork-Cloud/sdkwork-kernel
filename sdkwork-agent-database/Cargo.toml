[package]
name = "sdkwork-agent-database"
version = "0.1.0"
edition = "2021"
description = "Database abstraction layer for SDKWork agent session persistence"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
postgres-sync = [
    "dep:sdkwork-database-config",
    "dep:sdkwork-database-sqlx",
    "dep:sqlx",
    "dep:tokio",
]

[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-utils-rust = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
sdkwork-database-config = { workspace = true, optional = true }
sdkwork-database-sqlx = { workspace = true, optional = true }
sqlx = { version = "0.8", default-features = false, optional = true, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.0", optional = true, features = ["rt-multi-thread", "macros"] }

# SQLite
rusqlite = { version = "0.32.1", optional = true, features = ["bundled"] }

[[test]]
name = "agent_runtime_postgres_contracts"
path = "tests/agent_runtime_postgres_contracts.rs"
required-features = ["postgres-sync"]
