[package]
name = "sdkwork-agent-database"
version = "0.1.0"
edition = "2021"
description = "Database abstraction layer for SDKWork agent persistence (SQLite + PostgreSQL)"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]

[dependencies]
sdkwork-agent-kernel = { path = "../sdkwork-agent-kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

# SQLite
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }

# PostgreSQL
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
deadpool-postgres = { version = "0.14", optional = true }
