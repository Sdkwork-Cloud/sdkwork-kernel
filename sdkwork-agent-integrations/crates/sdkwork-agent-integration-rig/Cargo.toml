[package]
name = "sdkwork-agent-integration-rig"
version = "0.1.0"
edition = "2021"

[lib]
name = "sdkwork_agent_integration_rig"
path = "src/lib.rs"

[dependencies]
sdkwork-agent-kernel.workspace = true
sdkwork-agent-integration-core.workspace = true
rig-core = { path = "../../../external/rig/crates/rig-core", optional = true, default-features = false }

[features]
default = []
rig-core-adapter = ["dep:rig-core"]
