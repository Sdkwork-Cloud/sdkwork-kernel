[package]
name = "sdkwork-agent-provider-spi"
version = "0.1.0"
edition = "2021"
description = "Agent SDK adaptation SPI for binding external agent native SDKs to the SDKWork Agent Kernel"

[dependencies]
sdkwork-agent-provider-core.workspace = true
sdkwork-agent-kernel.workspace = true
sdkwork-agent-provider-transport-ipc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
