[package]
name = "sdkwork-agent-sdk-spi"
version = "0.1.0"
edition = "2021"
description = "Agent SDK adaptation SPI for binding external agent native SDKs to the SDKWork Agent Kernel"

[dependencies]
sdkwork-agent-adapter-core = { path = "../sdkwork-kernel-plugins/crates/sdkwork-agent-adapter-core" }
sdkwork-agent-kernel = { path = "../sdkwork-agent-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
