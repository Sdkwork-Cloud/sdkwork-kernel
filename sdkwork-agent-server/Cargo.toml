[package]
name = "sdkwork-agent-server"
version = "0.1.0"
edition = "2021"
description = "SDKWork Agent Server - runnable server binary with config, preflight, health checks"

[[bin]]
name = "sdkwork-agent-server"
path = "src/main.rs"

[dependencies]
sdkwork-agent-kernel = { path = "../sdkwork-agent-kernel" }
sdkwork-code-kernel = { path = "../sdkwork-code-kernel" }
sdkwork-agent-business = { path = "../sdkwork-agent-business", features = ["http-axum"] }
sdkwork-agent-api-bridge = { path = "../sdkwork-agent-api-bridge" }
sdkwork-agent-streaming = { path = "../sdkwork-agent-streaming" }
sdkwork-agent-database = { path = "../sdkwork-agent-database", features = ["sqlite"] }
sdkwork-agent-session = { path = "../sdkwork-agent-session" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
subtle = "2"
sdkwork-agent-plugin-core = { path = "../sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-core" }
sdkwork-agent-plugin-rig = { path = "../sdkwork-kernel-plugins/crates/sdkwork-agent-plugin-rig" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
