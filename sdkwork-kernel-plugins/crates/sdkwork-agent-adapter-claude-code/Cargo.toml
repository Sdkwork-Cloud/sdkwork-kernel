[package]
name = "sdkwork-agent-adapter-claude-code"
version = "0.1.0"
edition = "2021"
description = "Adapter for converting Claude Code session models to SDKWork AgentSession"

[dependencies]
sdkwork-agent-kernel = { path = "../../../sdkwork-agent-kernel" }
sdkwork-agent-adapter-core = { path = "../sdkwork-agent-adapter-core" }
sdkwork-agent-sdk-spi = { path = "../../../sdkwork-agent-sdk-spi" }
sdkwork-agent-sdk-backend-core = { path = "../../../sdkwork-agent-sdk-backend-core" }
sdkwork-agent-sdk-backend-node = { path = "../../../sdkwork-agent-sdk-backend-node" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
